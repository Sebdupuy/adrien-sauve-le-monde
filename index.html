<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrien sauve le monde — Générique de fin</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: min(90vw, 560px);
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 400;
      letter-spacing: .04em;
      margin: 0 0 14px;
    }

    p {
      font-size: 14px;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .65;
      margin: 0 0 40px;
    }

    .play {
      display: inline-block;
      padding: 18px 32px;
      border: 1px solid rgba(255,255,255,.5);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: .15em;
      text-transform: uppercase;
      transition: background .2s, color .2s;
    }

    .play:hover {
      background: #fff;
      color: #080808;
    }

    .note {
      font-size: 12px;
      letter-spacing: .04em;
      margin-top: 24px;
      opacity: .35;
    }
  </style>
</head>

<body>

  <main>
    <h1>Adrien sauve le monde</h1>

    <p>Générique de fin</p>

    <a class="play" href="generique.mp3">
      ▶ Écouter le générique
    </a>

    <div class="note">
      Lancez la musique pour le générique de fin.
    </div>
  </main>

</body>
</html>
